<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Змейка P2P</title>
    <style>
        /* Общие стили для темной темы */
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            color: #00d2ff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
            margin-bottom: 10px;
        }

        .info-panel {
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .my-snake { color: #00ffcc; font-weight: bold; text-shadow: 0 0 5px rgba(0,255,204,0.5); }
        .enemy-snake { color: #ff3366; font-weight: bold; text-shadow: 0 0 5px rgba(255,51,102,0.5); }

        /* ИГРОВОЕ ПОЛЕ: Черный фон и синие линии сетки */
        #gameCanvas {
            background-color: #000000;
            border: 2px solid #0066ff;
            box-shadow: 0 0 20px rgba(0, 102, 255, 0.5);
            /* Создаем синюю сетку через CSS градиенты */
            background-image: 
                linear-gradient(to right, rgba(0, 102, 255, 0.25) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 102, 255, 0.25) 1px, transparent 1px);
            background-size: 20px 20px; /* Размер клетки */
        }

        /* Меню и кнопки */
        .menu {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background: linear-gradient(135deg, #0055ff, #0033aa);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        button:hover {
            background: linear-gradient(135deg, #0077ff, #0044cc);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 102, 255, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .footer {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #556688;
        }
    </style>
</head>
<body>

    <h1>Змейка P2P</h1>
    
    <div class="info-panel">
        Онлайн: нажмите «Играть онлайн» или создайте комнату для друга. <br>
        Сервер только знакомит вас, сама игра идёт напрямую между браузерами.
    </div>

    <div class="info-panel">
        <span class="my-snake">■ Моя змейка</span> &nbsp;&nbsp;&nbsp;&nbsp; 
        <span class="enemy-snake">■ Змейка врага</span>
    </div>

    <!-- Игровое поле -->
    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <!-- Интерфейс управления -->
    <div class="menu">
        <button onclick="startGame('online')">Играть онлайн</button>
        <button onclick="createRoom()">Создать комнату для друга</button>
        <button onclick="joinCode()">Войти по коду</button>
        <button onclick="startGame('single')">Играть одному</button>
    </div>

    <div class="menu">
        <button onclick="copyCode()">Копировать код</button>
        <button onclick="connect()">Подключиться</button>
        <button onclick="goBack()">Назад</button>
    </div>

    <div class="footer">
        🌳 Древо | Старт | Выйти
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const cellSize = 20;

        // Демонстрационная отрисовка змеек для проверки стиля карты
        function drawDemo() {
            // Очищаем Canvas (сетка прорисуется автоматически за счет CSS фона)
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Рисуем "Мою змейку" (Неоновый бирюзовый)
            ctx.fillStyle = '#00ffcc';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#00ffcc';
            // Тело змейки
            ctx.fillRect(100, 200, cellSize - 2, cellSize - 2);
            ctx.fillRect(120, 200, cellSize - 2, cellSize - 2);
            ctx.fillRect(140, 200, cellSize - 2, cellSize - 2);
            ctx.fillRect(160, 200, cellSize - 2, cellSize - 2);

            // Рисуем "Змейку врага" (Неоновый малиновый)
            ctx.fillStyle = '#ff3366';
            ctx.shadowColor = '#ff3366';
            ctx.fillRect(400, 100, cellSize - 2, cellSize - 2);
            ctx.fillRect(400, 120, cellSize - 2, cellSize - 2);
            ctx.fillRect(420, 120, cellSize - 2, cellSize - 2);

            // Рисуем яблоко (Неоновый желтый/оранжевый)
            ctx.fillStyle = '#ffff00';
            ctx.shadowColor = '#ffff00';
            ctx.fillRect(300, 220, cellSize - 2, cellSize - 2);
            
            // Сбрасываем тень, чтобы не тормозило
            ctx.shadowBlur = 0;
        }

        // Запуск демо-режима при открытии страницы
        drawDemo();

        // Заглушки функций для интерфейса
        function startGame(mode) { 
            alert('Режим "' + mode + '" запущен! (Сетка настроена)'); 
        }
        function createRoom() { alert('Комната создана. Код сгенерирован.'); }
        function joinCode() { alert('Введите код для подключения.'); }
        function copyCode() { alert('Код скопирован в буфер обмена.'); }
        function connect() { alert('Подключение к пиру...'); }
        function goBack() { alert('Возврат в главное меню.'); }
    </script>
</body>
</html>
